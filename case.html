<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Case — Vanessa Souza</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .case-page{max-width:1180px;margin:auto;padding:125px 32px 90px}.case-back{font-size:13px}.case-hero{padding:58px 0 48px;border-bottom:1px solid var(--line)}.case-hero h1{font:500 clamp(2.8rem,5.3vw,5.5rem)/.92 Manrope;letter-spacing:-.06em;max-width:1050px;margin:24px 0}.case-hero h1 em{font-family:Georgia,serif;color:var(--violet);font-weight:400}.case-intro{max-width:820px;color:var(--muted);font-size:19px;line-height:1.6;margin:52px 0 0;padding:28px 0 0;border-top:1px solid var(--line)}.case-intro::before{content:'SOBRE O PROJETO';display:block;color:var(--violet);font:600 11px Manrope;letter-spacing:.14em;margin-bottom:18px}.case-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:40px 0 0}.case-meta div{border-top:1px solid var(--line);padding-top:15px}.case-meta b{display:block;font:600 36px Manrope}.case-meta span{font-size:12px;color:var(--muted)}.case-section{padding:70px 0}.case-section h2{font:500 clamp(2rem,4vw,4rem) Manrope;letter-spacing:-.05em;margin:0 0 25px}.case-section p{max-width:680px;color:var(--muted);font-size:18px;line-height:1.7}.case-visual{margin-top:45px;padding:28px;background:#dce8ec;border-radius:24px}.case-visual img{display:block;width:82%;margin:0 auto;border-radius:14px;box-shadow:0 24px 50px #24394026}.case-note{font-size:12px!important;margin-top:14px}.case-footer{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:25px}.case-page .section-index{color:var(--violet)}.tech-group{margin-top:55px;padding:42px 0;border-top:1px solid var(--line)}.tech-group h3{display:flex;align-items:center;gap:18px;font:600 30px Manrope;margin:0 0 12px}.tech-group h3::before{content:'</>';display:grid;place-items:center;width:62px;height:62px;border-radius:16px;background:var(--acid);color:var(--ink);font:700 22px monospace;animation:code-spin 5s ease-in-out infinite}@keyframes code-spin{0%,75%{transform:rotate(0)}85%{transform:rotate(12deg)}95%{transform:rotate(-12deg)}100%{transform:rotate(0)}}.tech-group p{font-size:16px!important;margin:0 0 22px}.tech-tags{display:flex;flex-wrap:wrap;gap:10px}.tech-tags span{padding:12px 16px;border:1px solid var(--ink);border-radius:999px;font:600 13px Manrope}
    .context-section{display:grid;grid-template-columns:.85fr 1.45fr;column-gap:45px;align-items:center}.context-section .section-index{grid-column:1 / -1}.context-section h2{font-size:clamp(2rem,3.2vw,3.4rem);margin-bottom:0;grid-column:1;grid-row:2}.context-section>p{margin:0;grid-column:1;grid-row:3}.context-section .case-visual{grid-column:2;grid-row:2 / 4;margin-top:0}.ecosystem-case{background:#171714;color:#fff;border-radius:24px;padding:65px 45px}.ecosystem-case .section-index{color:var(--acid)}.ecosystem-case h2{grid-column:2;color:#fff}.ecosystem-case>p{grid-column:2}.ecosystem-case .case-visual{grid-column:1;grid-row:2 / 4}.ecosystem-case .case-visual{background:#dce8ec}.process-case{padding-top:45px}.process-case .case-meta{position:relative;grid-template-columns:repeat(3,1fr);gap:0;margin-top:45px}.process-case .case-meta::before{content:'';position:absolute;left:0;right:0;top:22px;border-top:1px solid var(--violet);opacity:.35}.process-case .case-meta div{position:relative;border:0;padding:0 28px 0 0}.process-case .case-meta div:not(:first-child){padding-left:28px}.process-case .case-meta b{position:relative;z-index:1;display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--violet);color:white;font-size:15px;margin-bottom:24px}.process-case .case-meta span{display:block;font:500 17px/1.45 Manrope;color:var(--ink)}
    @media(max-width:700px){.case-page{padding:115px 22px 60px}.case-hero{padding-top:45px}.case-meta{grid-template-columns:1fr 1fr}.case-meta b{font-size:27px}.case-visual{padding:12px}.case-footer{gap:20px;flex-wrap:wrap}.context-section{display:block}.context-section h2{margin-bottom:25px}}
    @media(max-width:700px){.process-case .case-meta{display:block}.process-case .case-meta::before{top:0;bottom:0;left:22px;right:auto;border-top:0;border-left:1px solid var(--violet)}.process-case .case-meta div,.process-case .case-meta div:not(:first-child){padding:0 0 28px 58px}.process-case .case-meta b{position:absolute;left:0;top:0}.process-case .case-meta span{padding-top:8px}}
    .case-carousel{position:relative;min-height:460px;display:grid;place-items:center;overflow:hidden;cursor:grab;touch-action:pan-y}.case-carousel:active{cursor:grabbing}.case-carousel img{display:none!important;width:100%!important;height:460px!important;object-fit:contain!important}.case-carousel img.active{display:block!important;animation:slide-in .4s ease-out}@keyframes slide-in{from{opacity:.45;transform:translateX(42px)}to{opacity:1;transform:translateX(0)}}.case-carousel img.short-screen{height:330px!important}.carousel-controls{position:absolute;right:18px;bottom:18px;display:flex;gap:8px}.carousel-controls button{width:38px;height:38px;border:0;border-radius:50%;background:var(--ink);color:#fff;cursor:pointer;font-size:18px}.carousel-dots{position:absolute;left:18px;bottom:25px;display:flex;gap:6px}.carousel-dots i{width:7px;height:7px;border-radius:50%;background:#aaa}.carousel-dots i.active{background:var(--violet)}
    @media(min-width:701px){.context-section .case-visual{padding:14px;background:#fff}.context-section .case-visual img{width:100%;height:auto;object-fit:contain;object-position:center;border-radius:12px}}
  </style>
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <header class="nav-shell"><a class="logo" href="index.html">VS<span>°</span></a><nav><a href="index.html#sobre">Sobre</a><a href="index.html#projetos">Projetos</a><a href="index.html#contato">Contato</a></nav><a class="nav-cta" href="mailto:vanessafatima.desouza@gmail.com">Vamos conversar <span>↗</span></a></header>
  <main class="case-page" id="case-content"></main>
  <script>
    const project = new URLSearchParams(location.search).get('project') || 'ima';
    const cases = {
      ima: {tag:'PRODUCT DESIGN · DESIGN SYSTEM',title:'IMA — Cadastro Agropecuário',lead:'Como organizar um ecossistema digital complexo sem perder clareza, consistência e escala.',intro:'O Cadastro Agropecuário de Minas Gerais é um sistema governamental desenvolvido em parceria com o Instituto Mineiro de Agropecuária (IMA) para gerenciar e fiscalizar produtores e propriedades rurais em todo o estado. Como designer líder do projeto, fui responsável pela criação de um design system completo e robusto, capaz de suportar a complexidade de um sistema governamental de grande escala. O projeto envolveu a criação de milhares de variáveis no Figma, centenas de componentes interligados e uma arquitetura de design que permite escalabilidade e manutenção eficiente. Além do Figma, utilizamos TypeScript, Node e React para explorar e validar fluxos reais e complexos do produto.',stats:[['3.500+','variáveis no Figma'],['+8.000','conexões'],['45+','componentes'],],image:'sidagro-mock.png',second:'conexoes-ima.png'},
      alumni: {tag:'UX/UI · COMMUNITY',title:'Alumni ESAL UFLA',lead:'Uma experiência digital para transformar conexão em impacto para a educação.',intro:'Plataforma que aproxima ex-alunos, organiza campanhas e facilita doações para projetos educacionais.',stats:[['R$ 2M+','arrecadados'],['Web','experiência responsiva'],['Comunidade','ativa'],],image:'',second:''},
      eco: {tag:'PRODUCT DESIGN · WEB',title:'Eco — Créditos de Carbono',lead:'Transparência para conectar quem preserva a empresas que desejam compensar.',intro:'Marketplace com métricas de impacto, navegação clara e uma experiência de compra mais confiável.',stats:[['8.5M+','t CO₂'],['Tempo real','métricas'],['Marketplace','certificado'],],image:'',second:''}
    };
    const c=cases[project]||cases.ima;
    document.title=`${c.title} — Vanessa Souza`;
    document.querySelector('#case-content').innerHTML=`<a class="case-back" href="index.html#projetos">← Voltar para projetos</a><section class="case-hero"><div class="section-index">${c.tag}</div><h1>${c.title}<br><em>${c.lead}</em></h1><p class="case-intro">${c.intro}</p><div class="case-meta">${c.stats.map(s=>`<div><b>${s[0]}</b><span>${s[1]}</span></div>`).join('')}</div></section><section class="case-section"><div class="section-index">01 / CONTEXTO</div><h2>Complexidade que pede<br>clareza.</h2><p>O desafio foi tornar um produto amplo mais fácil de compreender, usando arquitetura da informação, componentes reutilizáveis e fluxos que acompanham o trabalho real das pessoas.</p>${c.image?`<div class="case-visual"><img src="${c.image}" alt="Mockup do projeto ${c.title}"></div>`:''}</section>${c.second?`<section class="case-section"><div class="section-index">02 / ECOSSISTEMA</div><h2>Um produto visto<br>como sistema.</h2><p>O mapa abaixo representa a densidade de relações e caminhos do projeto. Ele ajuda a comunicar a escala do trabalho sem expor informações internas.</p><div class="case-visual"><img src="${c.second}" alt="Mapa de conexões do projeto IMA"></div><p class="case-note">Visualização anonimizada das conexões entre fluxos, telas e componentes.</p></section><section class="case-section"><div class="section-index">03 / PROCESSO DE DESIGN</div><h2>Do problema<br>à estrutura.</h2><div class="case-meta"><div><b>01</b><span>Pesquisa<br>Análise de requisitos governamentais e necessidades dos usuários</span></div><div><b>02</b><span>Arquitetura<br>Estruturação do design system e definição de componentes</span></div><div><b>03</b><span>Prototipagem<br>Conexões avançadas e fluxos de usuário interativos</span></div></div></section>`:''}<footer class="case-footer"><a href="index.html#projetos">← Todos os projetos</a><a href="index.html#contato">Vamos conversar ↗</a></footer>`;
    if (project === 'ima') {
      document.querySelector('#case-content').insertAdjacentHTML('beforeend', '<section class="tech-group"><div class="section-index">04 / EXPLORAÇÃO TÉCNICA</div><h3>Usamos código para explorar o produto.</h3><p>Para validar fluxos reais e complexos, combinamos prototipação no Figma com uma camada funcional construída em código.</p><div class="tech-tags"><span>Figma</span><span>TypeScript</span><span>Node</span><span>React</span><span>+8.000 conexões</span></div></section>');
    }
    const contextSection = document.querySelector('#case-content .case-section');
    if (contextSection) contextSection.classList.add('context-section');
    if (contextSection) contextSection.querySelector('h2').textContent = 'Complexidade que pede clareza.';
    if (project === 'ima' && contextSection) {
      const visual = contextSection.querySelector('.case-visual');
      const screens = ['ima-tela-1.png','ima-tela-2.png','ima-tela-3.png','ima-tela-4.png'];
      visual.innerHTML = `<div class="case-carousel">${screens.map((src,i)=>`<img class="${i===0?'active ':''}${i===3?'short-screen':''}" src="${src}" alt="Tela ${i+1} do projeto IMA">`).join('')}<div class="carousel-dots">${screens.map((_,i)=>`<i class="${i===0?'active':''}"></i>`).join('')}</div><div class="carousel-controls"><button type="button" data-dir="-1" aria-label="Tela anterior">←</button><button type="button" data-dir="1" aria-label="Próxima tela">→</button></div></div>`;
      const carousel = visual.querySelector('.case-carousel');
      carousel.querySelector('.carousel-controls').remove();
      const imgs = [...carousel.querySelectorAll('img')];
      const dots = [...carousel.querySelectorAll('.carousel-dots i')];
      let current = 0;
      const show = (index) => { current = (index + imgs.length) % imgs.length; imgs.forEach((img,i)=>img.classList.toggle('active',i===current)); dots.forEach((dot,i)=>dot.classList.toggle('active',i===current)); };
      carousel.querySelectorAll('button').forEach(button => button.addEventListener('click', () => show(current + Number(button.dataset.dir))));
      let dragStart = null;
      carousel.addEventListener('pointerdown', event => { dragStart = event.clientX; carousel.setPointerCapture(event.pointerId); });
      carousel.addEventListener('pointerup', event => { if (dragStart === null) return; const distance = event.clientX - dragStart; if (Math.abs(distance) > 45) show(current + (distance < 0 ? 1 : -1)); dragStart = null; });
      setInterval(() => show(current + 1), 5000);
    }
    document.querySelectorAll('#case-content .case-section').forEach(section => {
      if (section.textContent.includes('02 / ECOSSISTEMA')) section.classList.add('context-section');
      if (section.textContent.includes('02 / ECOSSISTEMA')) section.classList.add('ecosystem-case');
      if (section.textContent.includes('03 / PROCESSO DE DESIGN')) section.classList.add('process-case');
    });
  </script>
</body>
</html>
