        { src:'manejo-mobile-cadastro.png', title:'Cadastro', group:'Animais', alt:'Formulário para cadastrar animal no celular' }
      ];
      const mobileSection = document.querySelector('.manejo-mobile');
      const mobileSteps = mobileSection.querySelector('.manejo-mobile__steps');
      mobileSteps.innerHTML = mobileScreens.map((screen, index) => `<button type="button" data-mobile-index="${index}" aria-pressed="${index === 0}"><b>${String(index + 1).padStart(2, '0')}</b><strong>${screen.title}</strong><small>${screen.group}</small></button>`).join('');
      const mobileImage = mobileSection.querySelector('.manejo-mobile__screen img');
      const mobileCurrent = mobileSection.querySelector('.manejo-mobile__current');
      const mobileOriginal = mobileSection.querySelector('.manejo-mobile__original');
      const mobileButtons = [...mobileSteps.querySelectorAll('button')];
      let mobileIndex = 0;
      const showMobileScreen = index => {
        mobileIndex = (index + mobileScreens.length) % mobileScreens.length;
        const screen = mobileScreens[mobileIndex];
        mobileImage.src = screen.src;
        mobileImage.alt = screen.alt;
        mobileCurrent.textContent = `${String(mobileIndex + 1).padStart(2, '0')} / 08 · ${screen.title}`;
        mobileOriginal.href = screen.src;
        mobileButtons.forEach((button, buttonIndex) => button.setAttribute('aria-pressed', String(buttonIndex === mobileIndex)));
        if (window.matchMedia('(max-width:800px)').matches) {
          const selected = mobileButtons[mobileIndex];
          const left = selected.getBoundingClientRect().left - mobileSteps.getBoundingClientRect().left + mobileSteps.scrollLeft - (mobileSteps.clientWidth - selected.clientWidth) / 2;
          mobileSteps.scrollTo({ left, behavior:'smooth' });
        }
      };
      mobileButtons.forEach((button, index) => button.addEventListener('click', () => showMobileScreen(index)));
      mobileSection.querySelectorAll('[data-mobile-dir]').forEach(button => button.addEventListener('click', () => showMobileScreen(mobileIndex + Number(button.dataset.mobileDir))));
    }
    const connectionText = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
    const textNodes = [];
    while (connectionText.nextNode()) textNodes.push(connectionText.currentNode);
    textNodes.forEach(node => { node.nodeValue = node.nodeValue.replaceAll('+8.000', '+200'); });
  </script>
</body>
</html>
