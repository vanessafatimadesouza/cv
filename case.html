    /* Overrides finais do case Alumni */

    #case-content>.alumni-hero{margin-left:-5.1vw;margin-right:-5.1vw;padding-left:5.1vw;padding-right:5.1vw}
    body.project-alumni .case-hero::before,body.project-alumni .case-hero>.section-index::after{content:none}
    body.project-eco .case-hero::before,body.project-eco .case-hero>.section-index::after{content:none}
    #case-content>.eco-hero{margin-left:-5.1vw;margin-right:-5.1vw;padding-left:5.1vw;padding-right:5.1vw;background:linear-gradient(145deg,#edf3ef,#f3f0e8 60%,#e2eee5)}
    #case-content>.eco-hero h1 em{color:#155642}.eco-showcase{padding:96px 0}.eco-showcase__intro{display:grid;grid-template-columns:.82fr 1.45fr;gap:6vw;align-items:start;margin-bottom:54px}.eco-showcase h2{margin:0!important;font-size:clamp(3rem,5vw,5.2rem)!important;line-height:.94}.eco-showcase__intro p{margin:4px 0 0!important;max-width:680px}.eco-shot-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}.eco-shot-grid figure{margin:0;border:1px solid rgba(23,23,20,.13);border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 18px 42px rgba(16,58,44,.12)}.eco-shot-grid figure:first-child{grid-column:1/-1}.eco-shot-grid img{display:block;width:100%;height:auto}.eco-shot-grid figcaption{padding:13px 16px 16px;color:var(--muted);font-size:13px}.eco-dashboard{background:#155642;color:#fff;margin-left:-5.1vw;margin-right:-5.1vw;padding:100px 5.1vw}.eco-dashboard h2{color:#fff!important;max-width:700px}.eco-dashboard>p{color:#d2e6dc!important;margin:26px 0 52px!important}.eco-dashboard .eco-shot-grid figure{box-shadow:0 22px 54px rgba(0,0,0,.25)}
    #case-content>.alumni-impact{width:calc(100% + 10.2vw);max-width:none;margin:0 0 0 -5.1vw;padding:115px clamp(22px,8vw,120px);background:#6555e8!important;color:#fff;border:0}

    #case-content>.alumni-context{width:100%;max-width:1380px;margin:0 auto;padding:100px 5.5vw 90px;display:grid;grid-template-columns:.82fr 1.45fr;column-gap:6vw;align-items:start}

<body>
  <div class="noise" aria-hidden="true"></div>
  <header class="nav-shell"><a class="logo" href="index.html">VS<span>°</span></a><nav><a href="index.html#sobre">Sobre</a><a href="index.html#projetos">Projetos</a><a href="index.html#contato">Contato</a></nav><a class="nav-cta" href="mailto:vanessafatima.desouza@gmail.com">Vamos conversar <span>↗</span></a></header>
  <main class="case-page" id="case-content"></main>
  <script>
    const project = new URLSearchParams(location.search).get('project') || 'ima';
    const cases = {
      ima: {tag:'PRODUCT DESIGN · DESIGN SYSTEM',title:'IMA — Cadastro Agropecuário',lead:'Como organizar um ecossistema digital complexo sem perder clareza, consistência e escala.',intro:'O Cadastro Agropecuário de Minas Gerais é um sistema governamental desenvolvido em parceria com o Instituto Mineiro de Agropecuária (IMA) para gerenciar e fiscalizar produtores e propriedades rurais em todo o estado. Como designer líder do projeto, fui responsável pela criação de um design system completo e robusto, capaz de suportar a complexidade de um sistema governamental de grande escala. O projeto envolveu a criação de milhares de variáveis no Figma, centenas de componentes interligados e uma arquitetura de design que permite escalabilidade e manutenção eficiente. Além do Figma, utilizamos TypeScript, Node e React para explorar e validar fluxos reais e complexos do produto.',stats:[['3.500+','variáveis no Figma'],['+8.000','conexões'],['45+','componentes'],],image:'sidagro-mock.png',second:'conexoes-sidagro.png'},
      alumni: {tag:'UX/UI · COMMUNITY · EDUCAÇÃO',title:'Alumni ESAL UFLA',lead:'Uma experiência digital para transformar conexão em impacto para a educação.',intro:'Uma plataforma institucional para aproximar ex-alunos, valorizar a história da ESAL-UFLA e tornar a contribuição para a universidade mais simples, clara e humana.',stats:[['R$ 2M+','em potencial de impacto'],['4','frentes de conteúdo'],['1','comunidade conectada'],],image:'alumni-tela-1.png',second:''},
      eco: {tag:'PRODUCT DESIGN · WEB',title:'Eco — Créditos de Carbono',lead:'Transparência para conectar quem preserva a empresas que desejam compensar.',intro:'Marketplace com métricas de impacto, navegação clara e uma experiência de compra mais confiável.',stats:[['8.5M+','t CO₂'],['Tempo real','métricas'],['Marketplace','certificado'],],image:'',second:''}
    };
    const c=cases[project]||cases.ima;
    document.body.classList.add(`project-${project}`);
    document.title=`${c.title} — Vanessa Souza`;
    document.querySelector('#case-content').innerHTML=`<a class="case-back" href="index.html#projetos">← Voltar para projetos</a><section class="case-hero"><div class="section-index">${c.tag}</div><h1>${c.title}<br><em>${c.lead}</em></h1><p class="case-intro">${c.intro}</p><div class="case-meta">${c.stats.map(s=>`<div><b>${s[0]}</b><span>${s[1]}</span></div>`).join('')}</div></section><section class="case-section"><div class="section-index">01 / CONTEXTO</div><h2>Complexidade que pede<br>clareza.</h2><p>O desafio foi tornar um produto amplo mais fácil de compreender, usando arquitetura da informação, componentes reutilizáveis e fluxos que acompanham o trabalho real das pessoas.</p>${c.image?`<div class="case-visual"><img src="${c.image}" alt="Mockup do projeto ${c.title}"></div>`:''}</section>${c.second?`<section class="case-section"><div class="section-index">02 / ECOSSISTEMA</div><h2>Um produto visto<br>como sistema.</h2><p>O mapa abaixo representa a densidade de relações e caminhos do projeto. Ele ajuda a comunicar a escala do trabalho sem expor informações internas.</p><div class="case-visual"><img src="${c.second}" alt="Mapa de conexões do projeto IMA"></div><p class="case-note">Visualização anonimizada das conexões entre fluxos, telas e componentes.</p></section><section class="case-section"><div class="section-index">03 / PROCESSO DE DESIGN</div><h2>Do problema<br>à estrutura.</h2><div class="case-meta"><div><b>01</b><span>Pesquisa<br>Análise de requisitos governamentais e necessidades dos usuários</span></div><div><b>02</b><span>Arquitetura<br>Estruturação do design system e definição de componentes</span></div><div><b>03</b><span>Prototipagem<br>Conexões avançadas e fluxos de usuário interativos</span></div></div></section>`:''}<footer class="case-footer"><a href="index.html#projetos">← Todos os projetos</a><a href="index.html#contato">Vamos conversar ↗</a></footer>`;
    if (project === 'alumni') document.querySelector('#case-content').innerHTML = `<a class="case-back" href="index.html#projetos">← Voltar para projetos</a><section class="case-hero alumni-hero"><div class="section-index">${c.tag}</div><h1>${c.title}<br><em>${c.lead}</em></h1><p class="case-intro">${c.intro}</p><div class="case-meta">${c.stats.map(s=>`<div><b>${s[0]}</b><span>${s[1]}</span></div>`).join('')}</div></section><section class="case-section alumni-context"><div class="section-index">01 / CONTEXTO</div><h2>Complexidade que pede<br>clareza.</h2><p>O site reúne as pessoas e as histórias que formam a ESAL-UFLA em uma experiência acessível, institucional e orientada à ação. A arquitetura equilibra apresentação da universidade, conteúdo dos cursos e o convite para doar.</p><div class="alumni-gallery"><figure class="alumni-gallery__hero"><img src="alumni-tela-1.png" alt="Tela inicial do site Alumni ESAL UFLA"><figcaption>Homepage institucional: uma entrada acolhedora para a comunidade Alumni.</figcaption></figure><figure><img src="alumni-tela-2.png" alt="Seção de cursos integrantes do site Alumni ESAL UFLA"><figcaption>Cursos integrantes: conteúdo organizado para apresentar a universidade.</figcaption></figure></div></section><section class="case-section alumni-impact"><div class="section-index">02 / IMPACTO QUE SE EXPLICA</div><h2>Doar também é<br>entender o impacto.</h2><p>As telas aproximam a contribuição de resultados concretos: bolsas de estudo, pesquisa, tecnologia e infraestrutura. A comunicação visual transforma a doação em participação na história da universidade.</p><div class="alumni-gallery alumni-gallery--reverse"><figure><img src="alumni-tela-3.png" alt="Seção de bolsas de estudo e pesquisa do site Alumni ESAL UFLA"><figcaption>Frentes de impacto apresentadas com clareza.</figcaption></figure><figure class="alumni-gallery__hero"><img src="alumni-tela-4.png" alt="Seção Nossa História do site Alumni ESAL UFLA"><figcaption>Memória institucional conectada ao futuro.</figcaption></figure></div></section><section class="alumni-principles"><div class="section-index">03 / DIREÇÃO DE DESIGN</div><div class="alumni-principles__grid"><div><b>01</b><h3>Acolher</h3><p>Uma linguagem visual próxima, que convida diferentes gerações a se reconhecerem na instituição.</p></div><div><b>02</b><h3>Organizar</h3><p>Informação institucional distribuída em blocos objetivos, com leitura confortável e navegação direta.</p></div><div><b>03</b><h3>Mobilizar</h3><p>Chamadas para doar posicionadas como continuidade natural da relação com a universidade.</p></div></div></section><footer class="case-footer"><a href="index.html#projetos">← Todos os projetos</a><a href="index.html#contato">Vamos conversar ↗</a></footer>`;
    if (project === 'eco') document.querySelector('#case-content').innerHTML = `<a class="case-back" href="index.html#projetos">← Voltar para projetos</a><section class="case-hero eco-hero"><div class="section-index">PRODUCT DESIGN · WEB</div><h1>Eco —<br>Créditos de Carbono<br><em>Transparência para transformar preservação em valor.</em></h1></section><section class="case-section eco-showcase"><div class="eco-showcase__intro"><div><div class="section-index">01 / PLATAFORMA</div><h2>Uma jornada clara,<br>do impacto à ação.</h2></div><p>Uma plataforma completa para conectar empresas, projetos e créditos de carbono em uma experiência simples, confiável e orientada por dados.</p></div><div class="eco-shot-grid"><figure><img src="eco-tela-1.png" alt="Landing page da Eco"><figcaption>Landing page: proposta de valor, indicadores e pontos de entrada para a plataforma.</figcaption></figure><figure><img src="eco-tela-2.png" alt="Benefícios da plataforma Eco"><figcaption>Benefícios e critérios de confiança para a negociação de créditos.</figcaption></figure><figure><img src="eco-tela-3.png" alt="Como funciona a Eco"><figcaption>Fluxo de uso apresentado em etapas simples e transparentes.</figcaption></figure></div></section><section class="case-section eco-dashboard"><div class="section-index">02 / GESTÃO</div><h2>Dados que apoiam<br>boas decisões.</h2><p>O dashboard centraliza créditos, relatórios e simulações para acompanhar cada negociação com clareza.</p><div class="eco-shot-grid"><figure><img src="eco-tela-4.png" alt="Dashboard de créditos da Eco"><figcaption>Painel inicial com visão dos créditos disponíveis.</figcaption></figure><figure><img src="eco-tela-5.png" alt="Relatórios de vendas da Eco"><figcaption>Relatórios com indicadores de venda e receita.</figcaption></figure><figure><img src="eco-tela-6.png" alt="Tabela de vendas da Eco"><figcaption>Detalhamento das transações realizadas.</figcaption></figure></div></section><section class="case-section eco-showcase"><div class="eco-showcase__intro"><div><div class="section-index">03 / MERCADO</div><h2>Negociar com<br>segurança.</h2></div><p>Filtros, cotações e calculadoras tornam o mercado de carbono mais acessível para quem compra, vende e acompanha o próprio impacto.</p></div><div class="eco-shot-grid"><figure><img src="eco-tela-7.png" alt="Simulador de créditos da Eco"><figcaption>Simulador para estimar valores e comparar tipos de projeto.</figcaption></figure><figure><img src="eco-tela-8.png" alt="Mercado de carbono da Eco"><figcaption>Marketplace com busca e cartões de créditos disponíveis.</figcaption></figure></div></section><footer class="case-footer"><a href="index.html#projetos">← Todos os projetos</a><a href="index.html#contato">Vamos conversar ↗</a></footer>`;
    const connectionSection = [...document.querySelectorAll('#case-content .case-section')].find(section => section.textContent.includes('02 / ECOSSISTEMA'));
    if (connectionSection) {
      const connectionVisual = connectionSection.querySelector('.case-visual');
      connectionVisual.innerHTML = `<div class="connection-map" aria-label="Mapa visual das conexões entre fluxos, telas e componentes"><img src="${c.second}" alt="Mapa de conexões do projeto IMA"><span class="connection-map__legend"><i></i> mapa de relações</span><span class="connection-map__spotlight" aria-hidden="true"></span><span class="connection-map__node connection-map__node--one">G</span><span class="connection-map__node connection-map__node--two">G</span><span class="connection-map__node connection-map__node--three">↗</span><span class="connection-map__label connection-map__label--top"><strong>+8.000</strong>conexões entre fluxos</span><span class="connection-map__label connection-map__label--bottom"><strong>45+</strong>componentes relacionados</span></div>`;
      const map = connectionVisual.querySelector('.connection-map');
      map.querySelectorAll('.connection-map__node').forEach(node => { if (node.textContent.trim() === 'G') node.remove(); });
      map.addEventListener('pointermove', event => { const rect = map.getBoundingClientRect(); map.style.setProperty('--mx', `${((event.clientX - rect.left) / rect.width) * 100}%`); map.style.setProperty('--my', `${((event.clientY - rect.top) / rect.height) * 100}%`); });
      map.addEventListener('pointerleave', () => { map.style.setProperty('--mx', '52%'); map.style.setProperty('--my', '48%'); });
      const ecosystemCopy = document.createElement('div');
      ecosystemCopy.className = 'ecosystem-copy';
      const ecosystemHeading = connectionSection.querySelector('h2');
      const ecosystemDescription = connectionSection.querySelector(':scope > p:not(.case-note)');
      ecosystemCopy.append(ecosystemHeading, ecosystemDescription);
      connectionSection.insertBefore(ecosystemCopy, connectionVisual);
    }
    document.querySelector('.case-hero').insertAdjacentHTML('beforeend', '<span class="case-scroll-note">SCROLL<i></i></span>');
    if (project === 'ima') document.querySelector('.case-hero').insertAdjacentHTML('afterend', `<section class="case-impact"><div class="impact-marquee"><span>+8.000 CONEXÕES · 45+ COMPONENTES · FIGMA · TYPESCRIPT · REACT · NODE · PRODUCT DESIGN · DESIGN SYSTEM · IMA · MINAS GERAIS · GOVERNO · 3.500+ VARIÁVEIS · </span><span aria-hidden="true">+8.000 CONEXÕES · 45+ COMPONENTES · FIGMA · TYPESCRIPT · REACT · NODE · PRODUCT DESIGN · DESIGN SYSTEM · IMA · MINAS GERAIS · GOVERNO · 3.500+ VARIÁVEIS · </span></div><div class="impact-stats">${c.stats.map(s=>`<div class="impact-stat"><b>${s[0]}</b><span>${s[1]}</span></div>`).join('')}</div></section><section class="case-about"><div class="case-about-label">SOBRE O PROJETO<b>IMA, 2025</b></div><p>${c.intro}</p></section>`);
    const firstSection = document.querySelector('#case-content .case-section');
    const heroIntro = document.querySelector('.case-hero .case-intro');
    const heroMeta = document.querySelector('.case-hero .case-meta');
    if (heroMeta) heroMeta.remove();
    if (heroIntro) heroIntro.remove();
    if (project === 'alumni') document.querySelector('.alumni-hero').insertAdjacentHTML('afterend', '<section class="alumni-about"><div class="alumni-about-title"><div class="section-index">01 / VISÃO GERAL</div><h2>Sobre o<br><em>Projeto</em></h2></div><p>A Associação de Ex-Alunos ESAL UFLA é uma organização dedicada a fortalecer os laços entre ex-alunos da instituição e apoiar o desenvolvimento contínuo da universidade.<br><br>Desenvolvi uma plataforma digital completa que facilita a conexão entre alumni, promove eventos de networking e, principalmente, centraliza os esforços de levantamento de fundos para projetos educacionais.<br><br>O site foi projetado com foco em usabilidade, transparência nas doações e engajamento da comunidade, resultando em um aumento significativo na participação e nas contribuições financeiras.</p></section>');
    if (project === 'ima') {
      document.querySelector('.case-hero h1').innerHTML = 'IMA —<br>Cadastro<br>Agropecuário<em>' + c.lead + '</em>';
      document.querySelector('.case-footer').insertAdjacentHTML('beforebegin', '<section class="tech-group"><div class="section-index">04 / EXPLORAÇÃO TÉCNICA</div><h3>Usamos código para explorar o produto.</h3><p>Para validar fluxos reais e complexos, combinamos prototipação no Figma com uma camada funcional construída em código.</p><div class="tech-tags"><span>Figma</span><span>TypeScript</span><span>Node</span><span>React</span><span>+8.000 conexões</span></div></section>');
      document.querySelector('.tech-group').insertAdjacentHTML('afterend', '<section class="case-quote"><p>"Design system não é uma biblioteca de componentes — é uma linguagem compartilhada que permite escalar sem perder coerência."</p></section>');
      document.querySelector('.case-quote').insertAdjacentHTML('afterend', '<section class="partnership-case"><div class="section-index">05 / PARCERIA</div><h2>Projeto em parceria</h2><img class="partnership-logos" src="sidagro-logos.png" alt="Logotipos do IMA e do laboratório OGEDAI"></section>');
    }
    const contextSection = document.querySelector('#case-content .case-section');
    if (project === 'ima' && contextSection) contextSection.classList.add('context-section');
    if (project === 'ima' && contextSection) contextSection.querySelector('h2').textContent = 'Complexidade que pede clareza.';
    if (project === 'ima' && contextSection) {
      const visual = contextSection.querySelector('.case-visual');
      const screens = ['sidagro-mock.png','ima-tela-1.png','ima-tela-2.png','ima-tela-3.png','ima-tela-5.png'];
      visual.innerHTML = `<div class="case-carousel">${screens.map((src,i)=>`<img class="${i===0?'active ':''}${i===3?'short-screen':''}" src="${src}" alt="Tela ${i+1} do projeto IMA">`).join('')}<div class="carousel-dots">${screens.map((_,i)=>`<i class="${i===0?'active':''}"></i>`).join('')}</div><div class="carousel-controls"><button type="button" data-dir="-1" aria-label="Tela anterior">←</button><button type="button" data-dir="1" aria-label="Próxima tela">→</button></div></div>`;
      const carousel = visual.querySelector('.case-carousel');
      carousel.querySelector('.carousel-controls').remove();
      const imgs = [...carousel.querySelectorAll('img')];
      const dots = [...carousel.querySelectorAll('.carousel-dots i')];
      let current = 0;
      const show = (index) => { current = (index + imgs.length) % imgs.length; imgs.forEach((img,i)=>img.classList.toggle('active',i===current)); dots.forEach((dot,i)=>dot.classList.toggle('active',i===current)); };
      carousel.querySelectorAll('button').forEach(button => button.addEventListener('click', () => show(current + Number(button.dataset.dir))));
      let dragStart = null;
      carousel.addEventListener('pointerdown', event => { dragStart = event.clientX; carousel.setPointerCapture(event.pointerId); });
      carousel.addEventListener('pointerup', event => { if (dragStart === null) return; const distance = event.clientX - dragStart; if (Math.abs(distance) > 45) show(current + (distance < 0 ? 1 : -1)); dragStart = null; });
      setInterval(() => show(current + 1), 5000);
    }
    document.querySelectorAll('#case-content .case-section').forEach(section => {
      if (section.textContent.includes('02 / ECOSSISTEMA')) section.classList.add('context-section');
      if (section.textContent.includes('02 / ECOSSISTEMA')) section.classList.add('ecosystem-case');
      if (section.textContent.includes('03 / PROCESSO DE DESIGN')) {
        section.classList.add('process-case');
        section.querySelectorAll('.case-meta > div').forEach((step, index) => { step.tabIndex = 0; step.setAttribute('aria-label', `Etapa ${index + 1}`); });
      }
    });
    const connectionText = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
    const textNodes = [];
    while (connectionText.nextNode()) textNodes.push(connectionText.currentNode);
    textNodes.forEach(node => { node.nodeValue = node.nodeValue.replaceAll('+8.000', '+200'); });
  </script>
</body>
</html>
